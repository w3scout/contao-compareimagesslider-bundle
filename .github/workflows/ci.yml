name: CI

on:
    pull_request: ~
    push:
        branches:
            - 'dev'
            - 'main'

jobs:
    cs:
        name: Coding Style
        runs-on: ubuntu-latest
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install ecs
                run: cd tools/ecs && composer update --no-interaction

            -   name: Run the CS fixer
                run: composer cs-fixer

    tests:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.2', '8.3' ]
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install phpunit
                run: cd tools/phpunit && composer update --no-interaction

            -   name: Install the dependencies
                run: composer update --no-interaction

            -   name: Run the unit tests
                run: composer unit-tests

    prefer-lowest-tests:
        name: PHP ${{ matrix.php }} --prefer-lowest
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.2', '8.3' ]
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install phpunit
                run: cd tools/phpunit && composer update --no-interaction

            -   name: Install the dependencies
                run: composer update --prefer-lowest --prefer-stable --no-interaction

            -   name: Run the unit tests
                run: composer unit-tests
