name: CI

on:
    pull_request: ~
    push:
        branches:
            - 'dev'
            - 'main'

jobs:
    cs:
        name: Coding Style
        runs-on: ubuntu-latest
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.3'

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install ecs
                run: cd tools/ecs && composer update --no-interaction

            -   name: Run the CS fixer
                run: composer cs-fixer

    tests:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.2', '8.3', '8.4' ]
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install phpunit
                run: cd tools/phpunit && composer update --no-interaction

            -   name: Install the dependencies
                run: composer update --no-interaction

            -   name: Run the unit tests
                run: composer unit-tests

    prefer-lowest-tests:
        name: PHP ${{ matrix.php }} --prefer-lowest
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.2', '8.3', '8.4' ]
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install phpunit
                run: cd tools/phpunit && composer update --no-interaction

            -   name: Install the dependencies
                run: composer update --prefer-lowest --prefer-stable --no-interaction

            -   name: Run the unit tests
                run: composer unit-tests

    integration-test:
        name: Integration (Contao ${{ matrix.contao }}, PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.2', '8.3', '8.4' ]
                contao: [ '5.3' ]

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: contao_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}

            -   name: Checkout bundle
                uses: actions/checkout@v4
                with:
                    path: bundle

            -   name: Create Contao project
                run: composer create-project contao/managed-edition:^${{ matrix.contao }} contao --no-interaction

            -   name: Add bundle as path repository
                run: |
                    cd contao
                    composer config repositories.bundle path ../bundle
                    composer require w3scout/contao-compareimagesslider-bundle:* --no-interaction

            -   name: Configure environment
                run: |
                    cd contao
                    echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/contao_test" > .env.local

            -   name: Run Contao migrations
                run: |
                    cd contao
                    php vendor/bin/contao-console contao:migrate --no-interaction
